[package]
name = "ttywright-grammar-loader"
version = "0.1.0"
edition = "2024"
description = "Loads a tree-sitter grammar from a shared library"

[dependencies]
# Hides dlopen and LoadLibrary, and keeps the handle's rules in one maintained place.
libloading = "0.9"
tree-sitter = "0.25"
tree-sitter-language = "0.1"

[dev-dependencies]
tempfile = "3"
